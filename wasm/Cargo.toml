[package]
name = "openpower-tools-wasm"
version = "0.1.0"
description = "WebAssembly module for www.openpower.tools"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.127"
console_error_panic_hook = "0.1.7"

# wasm-pack would otherwise run whichever wasm-opt it finds on PATH or download
# its own; for reproducible output we run a pinned binaryen from npm instead
# (see the opt:wasm script in package.json).
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
