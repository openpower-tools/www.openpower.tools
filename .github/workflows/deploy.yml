name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: 0.21.14
  # sha256 of trunk-x86_64-unknown-linux-gnu.tar.gz for that release
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HEADLESS_SHELL_VERSION: 152.0.7977.82
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml (pinned nightly, wasm32 target,
      # rustfmt, clippy); the runner image ships rustup.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Install pinned Trunk (prebuilt, checksum verified)
        run: |
          curl -fsSL -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum --check
          tar -xzf trunk.tar.gz
          install -m 0755 trunk "${HOME}/.cargo/bin/trunk"
          rm trunk trunk.tar.gz
          trunk --version

      - name: Cache Trunk's downloaded tools (wasm-bindgen, wasm-opt)
        uses: actions/cache@v5
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('Trunk.toml') }}

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Rust lints (wasm target)
        # Lib and bins only: test targets carry native-only dev-dependencies
        # (proptest, insta) and are linted by the native workspace run below.
        run: cargo clippy -p op-site -p op-webc -p op-parts -p op-terms -p op-chart --target wasm32-unknown-unknown -- -D warnings

      - name: Rust lints (native, every target)
        # The workspace's tests, benches and build tools, which the wasm run
        # cannot compile.
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (native)
        run: cargo test --workspace

      - name: Build site
        run: trunk build --release

      - name: Install ffmpeg (the report encodes each film's screencast as VP9 WebM)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Cache chrome-headless-shell
        uses: actions/cache@v5
        with:
          path: ~/.cache/op-headless-shell
          key: chrome-headless-shell-${{ env.HEADLESS_SHELL_VERSION }}-linux64
      - name: Install chrome-headless-shell (the synthetic frame clock needs the old headless engine)
        # The Chrome the runner ships runs the new headless mode, which has no
        # virtual time or frame control; Chrome for Testing publishes the old
        # engine as chrome-headless-shell, pinned here so every run renders
        # the same frames.
        run: |
          set -e
          npx --yes @puppeteer/browsers install "chrome-headless-shell@${HEADLESS_SHELL_VERSION}" --path ~/.cache/op-headless-shell > /tmp/shell-install.log
          SHELL_BIN=$(ls ~/.cache/op-headless-shell/chrome-headless-shell/linux-*/chrome-headless-shell-linux64/chrome-headless-shell | head -n 1)
          "$SHELL_BIN" --version
          echo "OP_HEADLESS_SHELL=$SHELL_BIN" >> "$GITHUB_ENV"

      - name: Interaction report (real-input harness over every control)
        # Drives each control through its machine edges with CDP mouse and
        # keyboard events on a synthetic frame clock (virtual time, one frame
        # per step) and renders the evidence; a failing check fails the build.
        uses: astral-sh/setup-uv@v7
      - run: uv run tools/interaction_report/report.py --dist dist --out reports/interactions --clock synthetic --checks-json reports/interactions/checks.json --publish
      - name: Reproducibility (a second synthetic pass decides the same, measures within a frame, and looks the same)
        run: |
          set -e
          cargo build --release -p op-verify
          uv run tools/interaction_report/report.py --dist dist --out /tmp/rep-again --clock synthetic --only opt-theme-toggle,opt-switch,opt-chart --checks-json /tmp/rep-again/checks.json
          target/release/compare-checks reports/interactions/checks.json /tmp/rep-again/checks.json
          target/release/compare-frames reports/interactions /tmp/rep-again
      - name: Reproducibility (the page build emits the same bytes twice)
        # The pre-rendered chart is what a reader without scripts is served,
        # and it comes out of op-pages rather than the element. Every step
        # from the data block to the markup is a pure function, so a second
        # emission must be byte identical; anything else means something on
        # that path is reading a clock, an iteration order or the filesystem.
        # op-pages writes into TRUNK_STAGING_DIR and reads only index.html
        # from it, so a second emission needs nothing but that file copied.
        run: |
          set -e
          mkdir -p /tmp/pages-again
          cp dist/index.html /tmp/pages-again/
          TRUNK_STAGING_DIR=/tmp/pages-again cargo run --quiet --release -p op-pages
          target/release/compare-pages dist /tmp/pages-again
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: interaction-report
          path: reports/interactions
          if-no-files-found: error

      - name: Record artifact hashes (compare with `sha256sum` of a local dist/)
        run: |
          {
            echo '## Artifact hashes'
            echo '```'
            find dist -type f | sort | xargs sha256sum
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          find dist -type f | sort | xargs sha256sum

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
