name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRUNK_VERSION: 0.21.14
  # sha256 of trunk-x86_64-unknown-linux-gnu.tar.gz for that release
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml (pinned nightly, wasm32 target,
      # rustfmt, clippy); the runner image ships rustup.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - name: Install pinned Trunk (prebuilt, checksum verified)
        run: |
          curl -fsSL -o trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/v${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "${TRUNK_SHA256}  trunk.tar.gz" | sha256sum --check
          tar -xzf trunk.tar.gz
          install -m 0755 trunk "${HOME}/.cargo/bin/trunk"
          rm trunk trunk.tar.gz
          trunk --version

      - name: Cache Trunk's downloaded tools (wasm-bindgen, wasm-opt)
        uses: actions/cache@v5
        with:
          path: ~/.cache/trunk
          key: trunk-tools-${{ hashFiles('Trunk.toml', 'Trunk.specimen.toml') }}

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Rust lints (wasm target)
        run: cargo clippy --workspace --all-targets --target wasm32-unknown-unknown -- -D warnings

      - name: Rust tests (native)
        run: cargo test --workspace

      - name: Build site (index, then the specimen page into dist/specimen)
        run: |
          trunk build --release
          trunk build --release --config Trunk.specimen.toml

      - name: Record artifact hashes (compare with `sha256sum` of a local dist/)
        run: |
          {
            echo '## Artifact hashes'
            echo '```'
            find dist -type f | sort | xargs sha256sum
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          find dist -type f | sort | xargs sha256sum

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
