name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup reads rust-toolchain.toml (pinned nightly, wasm32 target,
      # rustfmt, clippy); the runner image ships rustup.
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Rust lints (wasm target)
        run: cargo clippy --workspace --all-targets --target wasm32-unknown-unknown -- -D warnings

      - name: Rust tests (native)
        run: cargo test --workspace

      - name: Build site (wasm-pack, wasm-opt, tsc, vite)
        run: npm run build

      - name: Record artifact hashes (compare with `npm run hashes` locally)
        run: |
          {
            echo '## Artifact hashes'
            echo '```'
            npm run --silent hashes
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          npm run --silent hashes

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
