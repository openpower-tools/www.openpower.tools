[package]
name = "op-site"
version = "0.1.0"
description = "www.openpower.tools: the site, as custom elements written in Rust"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
op-fontpack.workspace = true
op-webc.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = [
  "Cache",
  "CacheStorage",
  "Clipboard",
  "CssStyleDeclaration",
  "CustomEvent",
  "CustomEventInit",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "FontFace",
  "FontFaceDescriptors",
  "FontFaceSet",
  "HtmlElement",
  "IntersectionObserver",
  "IntersectionObserverEntry",
  "IntersectionObserverInit",
  "KeyboardEvent",
  "MediaQueryList",
  "Location",
  "Navigator",
  "Node",
  "NodeList",
  "Performance",
  "Response",
  "ShadowRoot",
  "ShadowRootInit",
  "ShadowRootMode",
  "Storage",
  "Window",
  "console",
] }

[dev-dependencies]
op-pages.workspace = true
