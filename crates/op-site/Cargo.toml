[package]
name = "op-site"
version = "0.1.0"
description = "www.openpower.tools: the site, as custom elements written in Rust"
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
op-webc.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = [
  "CssStyleDeclaration",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "FontFace",
  "FontFaceDescriptors",
  "FontFaceSet",
  "HtmlElement",
  "Location",
  "Node",
  "NodeList",
  "ShadowRoot",
  "ShadowRootInit",
  "ShadowRootMode",
  "Storage",
  "Window",
] }
