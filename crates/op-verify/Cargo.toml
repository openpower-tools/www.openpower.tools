[package]
name = "op-verify"
description = "Reproducibility checks for the interaction report: a second pass decided the same, measured within a frame, and drew the same"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
op-chart.workspace = true
op-pages.workspace = true
op-colour.workspace = true
png.workspace = true

[[bin]]
name = "compare-checks"
path = "src/bin/compare_checks.rs"

[[bin]]
name = "compare-frames"
path = "src/bin/compare_frames.rs"

[[bin]]
name = "specimen-page"
path = "src/bin/specimen_page.rs"

[[bin]]
name = "specimen-measure"
path = "src/bin/specimen_measure.rs"

[[bin]]
name = "sweep-measure"
path = "src/bin/sweep_measure.rs"

[[bin]]
name = "labels-measure"
path = "src/bin/labels_measure.rs"

[[bin]]
name = "compare-pages"
path = "src/bin/compare_pages.rs"
