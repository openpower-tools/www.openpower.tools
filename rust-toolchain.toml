# Rust nightly, pinned to a dated build so local and CI builds use the same
# compiler and the wasm output is reproducible. Bump the date deliberately.
[toolchain]
channel = "nightly-2026-08-30"
targets = ["wasm32-unknown-unknown"]
# rust-src feeds the inspector source maps: op-assets resolves the
# stdlib paths in the wasm's DWARF against the toolchain's own sources.
components = ["rustfmt", "clippy", "rust-src"]
