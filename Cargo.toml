[workspace]
resolver = "3"
members = ["wasm"]

[workspace.package]
edition = "2024"
publish = false
repository = "https://github.com/openpower-tools/www.openpower.tools"

# Size-oriented release profile for the wasm module. wasm-pack additionally runs
# wasm-opt on the output.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
