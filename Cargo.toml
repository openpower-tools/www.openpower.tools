# trim-paths is nightly-only (rust-lang/cargo#12137); it strips machine-specific
# paths (~/.cargo/registry, ~/.rustup) from the wasm so local and CI builds are
# byte-identical.
cargo-features = ["trim-paths"]

[workspace]
resolver = "3"
members = ["crates/op-webc", "crates/op-site"]

[workspace.package]
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/openpower-tools/www.openpower.tools"

[workspace.dependencies]
wasm-bindgen = "0.2.127"
js-sys = "0.3.104"
web-sys = "0.3.104"
console_error_panic_hook = "0.1.7"
op-webc = { path = "crates/op-webc" }

# Size-oriented, reproducible release profile for the wasm binary. Trunk runs
# a pinned wasm-opt afterwards (see Trunk.toml).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
trim-paths = "all"
