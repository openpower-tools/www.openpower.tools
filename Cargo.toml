# trim-paths is nightly-only (rust-lang/cargo#12137); it strips machine-specific
# paths (~/.cargo/registry, ~/.rustup) from the wasm so local and CI builds are
# byte-identical.
cargo-features = ["trim-paths"]

[workspace]
resolver = "3"
members = ["crates/op-webc", "crates/op-parts", "crates/op-terms", "crates/op-chart", "crates/op-colour", "crates/op-site", "crates/op-assets", "crates/op-pages"]

[workspace.package]
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/openpower-tools/www.openpower.tools"

[workspace.dependencies]
op-chart = { path = "crates/op-chart" }
op-colour = { path = "crates/op-colour" }
insta = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.54"
js-sys = "0.3.104"
web-sys = "0.3.104"
console_error_panic_hook = "0.1.7"
op-webc = { path = "crates/op-webc" }
op-parts = { path = "crates/op-parts" }
op-terms = { path = "crates/op-terms" }
op-pages = { path = "crates/op-pages" }

# Size-oriented, reproducible release profile for the wasm binary. Trunk runs
# a pinned wasm-opt afterwards (see Trunk.toml).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
trim-paths = "all"
# Line-table DWARF rides into the wasm (kept by data-keep-debug) and
# feeds the source map op-assets generates; with trim-paths above, no
# build-machine path can leak into it. wasm-opt is disabled for the
# shipped wasm: binaryen 132 aborts updating this DWARF version, and a
# map made before optimization would not match the shipped offsets.
debug = "line-tables-only"
