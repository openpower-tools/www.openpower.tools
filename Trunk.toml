# Trunk builds crates/op-site for wasm32-unknown-unknown, runs wasm-bindgen and
# wasm-opt, and assembles dist/ from index.html. Tool versions are pinned here
# (and wasm-bindgen additionally by Cargo.lock) so builds are reproducible.

[build]
target = "index.html"
dist = "dist"
public_url = "/"
filehash = true

[tools]
wasm_bindgen = "0.2.127"
wasm_opt = "version_132"

[serve]
addresses = ["127.0.0.1"]
port = 8080

# Trunk runs same-stage hooks concurrently, so the two post-build steps are
# sequenced in one command: op-assets emits each webfont as a content-hashed
# woff2 and injects preload links plus the generated font stylesheet,
# then op-pages emits every registered page as <slug>/index.html reusing the
# staged head, which by then carries those font links.
[[hooks]]
stage = "post_build"
command = "sh"
command_arguments = ["-c", "cargo run --quiet --release -p op-assets && cargo run --quiet --release -p op-pages"]
