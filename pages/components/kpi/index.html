      <p>A single measurement, data-forward: big value, small label, optional unit and
      status colour. Several sit side by side and wrap with the line.</p>
      <h2>Example</h2>
      <p>
        <op-kpi label="CPU temp" value="52" unit="&deg;C" state="ok"></op-kpi>
        <op-kpi label="Fan 2" value="4,120" unit="rpm"></op-kpi>
        <op-kpi label="VRM temp" value="78" unit="&deg;C" state="warning"></op-kpi>
        <op-kpi label="12V rail" value="11.2" unit="V" state="danger"></op-kpi>
        <op-kpi label="Uptime" value="212" unit="days" state="info"></op-kpi>
      </p>
      <h2>Markup</h2>
      <pre>&lt;op-kpi label="CPU temp" value="52" unit="&amp;deg;C" state="ok"&gt;&lt;/op-kpi&gt;</pre>
