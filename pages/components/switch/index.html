      <p>A native checkbox drawn as a switch, for settings that take effect immediately.
      The control keeps checkbox semantics for assistive tech.</p>
      <h2>Example</h2>
      <op-switch>
        <label><input type="checkbox" checked /> Follow the system theme</label>
      </op-switch>
      <op-switch>
        <label><input type="checkbox" /> Verbose boot output</label>
      </op-switch>
      <h2>Markup</h2>
      <pre>&lt;op-switch&gt;
  &lt;label&gt;&lt;input type="checkbox" /&gt; Verbose boot output&lt;/label&gt;
&lt;/op-switch&gt;</pre>
